name: CI

on: 
    pull_request:
    workflow_dispatch:
    push:
        branches:
        - main


jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun add --frozen-lockfile

      - name: Run typecheck
        run: bun typecheck
      
      - name: Run biome lint and format check
        run: bun check

      - name: build project
        run: bun build
